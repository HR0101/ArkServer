name: macOS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test MediaServerKit
        working-directory: Packages/MediaServerKit
        run: swift test

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ArkServer.xcodeproj
          -scheme ArkServer

      - name: Build macOS app
        run: >-
          xcodebuild build
          -project ArkServer.xcodeproj
          -scheme ArkServer
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ArkServerDerivedData"
          CODE_SIGNING_ALLOWED=NO

      # テストは並列にしない。並列のままだと約 90 件が同時に動き、手元でも再生まわりのテストが不安定になる。
      # CI の仮想環境では固まって 30 分で打ち切られていた(並列を止めると同時に動くのは最大 3 件)。
      # 万一固まっても、ジョブ全体の 30 分を待たずに、このステップを 20 分で止める。
      - name: Test macOS app
        timeout-minutes: 20
        env:
          # テストの実行側へ渡す(TEST_RUNNER_ を外した名前 CI で届く)。画面を使うテストを飛ばす目印。
          TEST_RUNNER_CI: 'true'
        run: >-
          xcodebuild test
          -project ArkServer.xcodeproj
          -scheme ArkServer
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ArkServerDerivedData"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
